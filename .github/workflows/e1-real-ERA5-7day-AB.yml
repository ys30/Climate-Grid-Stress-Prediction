name: C2 E1 real ERA5 HIFLD TIGER seven-day winter summer geography sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_era5_AB_sevenday_sensitivity.py'
      - 'tests/test_era5_AB_sevenday_sensitivity.py'
      - '.github/workflows/e1-real-ERA5-7day-AB.yml'
jobs:
  real-seven-day-ERA5:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - start: '2023-01-15T00:00:00Z'
            season: winter2023
          - start: '2023-07-01T00:00:00Z'
            season: summer2023
          - start: '2025-01-15T00:00:00Z'
            season: winter2025
          - start: '2025-07-01T00:00:00Z'
            season: summer2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific source access libraries
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - name: Reject unauthorized geography and incomplete seven-day source windows
        run: python -m unittest discover -s tests -p 'test_era5_AB_sevenday_sensitivity.py' -v
      - name: Fetch independently archived frozen HIFLD candidate ERA5 weights A
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/hifld
      - name: Fetch independently archived Census TIGER county ERA5 weights B
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-real-ERA5-TIGER-2024-vs-HIFLD-2018-spatial-sensitivity-UNAPPROVED
          run-id: 43652340209
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/county
      - name: Compare original actual ERA5 temperatures every hour for seven contiguous UTC days
        run: |
          python -u -m src.c2_era5_AB_sevenday_sensitivity \
            --start '${{ matrix.start }}' --days 7 \
            --hifld-weights inputs/hifld/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --county-weights inputs/county/C2_TIGER2024_EIA861_COUNTY_ERA5_AREA_WEIGHTS_UNAPPROVED.csv \
            --out outputs/e1_sevenday_AB
      - name: Archive actual paired ERA5 observations, source SHA256 and day/BA statistics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-ERA5-seven-day-A-B-${{ matrix.season }}-NOT-MODEL
          path: outputs/e1_sevenday_AB/
          if-no-files-found: warn
