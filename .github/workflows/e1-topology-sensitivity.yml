name: C2 E1 national BA polygon topology sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_topology_sensitivity.py'
      - 'tests/test_topology_sensitivity.py'
      - '.github/workflows/e1-topology-sensitivity.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5'
      - run: python -m unittest discover -s tests -v
      - name: Re-download source national control-area polygons without altering originals
        run: python -m src.c2_national_polygon_extract --out outputs/e1_national_geometries
      - name: Assess make_valid candidate and projected area changes
        run: python -u -m src.c2_topology_sensitivity --source outputs/e1_national_geometries/four_ba_candidate_UNAPPROVED.geojson --out outputs/e1_topology
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-national-topology-sensitivity-unapproved
          path: |
            outputs/e1_national_geometries/
            outputs/e1_topology/
          if-no-files-found: warn
