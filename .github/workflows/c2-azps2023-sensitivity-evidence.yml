name: C2 AZPS2023 Sensitivity Evidence Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c2-azps2023-sensitivity-evidence.yml'
  workflow_run:
    workflows: ['C2 AZPS 2023 Noncanonical Sensitivity Evidence']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: c2-azps2023-sensitivity-status
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify noncanonical sensitivity archive and source SHA
        run: |
          mkdir -p evidence/audit
          python -m scripts.c2_azps2023_sensitivity_evidence \
            --output evidence/audit/azps2023_sensitivity_evidence.json
      - name: Commit verified status metadata only
        run: |
          cp evidence/audit/azps2023_sensitivity_evidence.json docs/E2_AZPS2023_SENSITIVITY_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E2_AZPS2023_SENSITIVITY_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "C2 E2: publish independently verified noncanonical AZPS sensitivity status"
            git pull --rebase
            git push
          fi
      - name: Retain status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-azps2023-sensitivity-status-${{ github.run_id }}
          path: evidence/audit/
          if-no-files-found: warn
          retention-days: 30
