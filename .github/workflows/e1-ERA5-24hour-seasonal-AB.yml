name: C2 E1 seasonal 24h real ERA5 HIFLD Census daily profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_era5_AB_24hour_sensitivity.py'
      - 'tests/test_era5_AB_24hour_sensitivity.py'
      - '.github/workflows/e1-ERA5-24hour-seasonal-AB.yml'
jobs:
  seasonal-day:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        utc_day: ['2023-01-15T00:00:00Z','2023-07-01T00:00:00Z','2025-01-15T00:00:00Z','2025-07-01T00:00:00Z']
        include:
          - utc_day: '2023-01-15T00:00:00Z'
            label: winter-2023
          - utc_day: '2023-07-01T00:00:00Z'
            label: summer-2023
          - utc_day: '2025-01-15T00:00:00Z'
            label: winter-2025
          - utc_day: '2025-07-01T00:00:00Z'
            label: summer-2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - run: python -m unittest discover -s tests -p 'test_era5_AB_24hour_sensitivity.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/hifld
      - uses: actions/download-artifact@v4
        with:
          name: c2-e1-real-ERA5-TIGER-2024-vs-HIFLD-2018-spatial-sensitivity-UNAPPROVED
          run-id: 43652340209
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/county
      - name: Compute actual complete UTC-day real ERA5 profile under both independent provisional masks
        run: |
          python -u -m src.c2_era5_AB_24hour_sensitivity \
            --hifld-weights inputs/hifld/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --county-weights inputs/county/C2_TIGER2024_EIA861_COUNTY_ERA5_AREA_WEIGHTS_UNAPPROVED.csv \
            --utc-day '${{ matrix.utc_day }}' \
            --out outputs/e1_AB_day
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-24h-ERA5-geography-AB-${{ matrix.label }}-NOT-MODEL
          path: outputs/e1_AB_day/
          if-no-files-found: warn
