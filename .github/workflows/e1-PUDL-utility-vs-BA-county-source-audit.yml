name: C2 E1 reconcile 24 PUDL BA-year source counties with actual state-scoped utility county evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e1-PUDL-utility-vs-BA-county-source-audit.yml'
      - 'src/c2_eia861_utility_BA_source_comparison.py'
      - 'tests/test_c2_eia861_utility_BA_source_comparison.py'
  workflow_run:
    workflows:
      - C2 E1 PUDL v2026.10 BA utility state county source bridge audit
    types: [completed]
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source county differences, state-limitation and no-load model gates
        run: python -m unittest discover -s tests -p 'test_c2_eia861_utility_BA_source_comparison.py' -v
      - name: Retrieve genuine PUDL v2026.10 BA utility state county bridge
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-PUDL-fixed-v2026-10-real-BA-utility-county-bridge-NOT-LOAD
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 43672928429 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/utility
      - name: Fail closed on original tagged PUDL source evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("inputs/utility/E1_EIA861_VERSIONED_UTILITY_SOURCE_ONLY_QA.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          expected={
            "core_eia861__assn_balancing_authority.parquet":"837b4f62e740a501ad8f0b96a3b7d8597fa888cf7ad516d0401cb284ab0f8ef0",
            "core_eia861__yearly_service_territory.parquet":"3d6c4cc54bd856e678fa0b3eb162e2c8867a3fbe64dfae8f862f0dd82cca0605",
          }
          hashes=d["original_PUDL_v2026_10_parquet_SHA256"]
          for name, digest in expected.items():
              if hashes[name]["sha256"]!=digest:
                  raise SystemExit("PUDL pinned source hash mismatch: "+name)
          required={"BA_year_slots":24,
                    "BA_utility_state_associations":1418,
                    "unmatched_utility_state_associations":439,
                    "distinct_ambiguous_utility_year_state_assignments":28}
          for key, value in required.items():
              if d.get(key)!=value:
                  raise SystemExit("PUDL source audit count mismatch: "+key)
          if d.get("actual_hourly_county_load_observed") is not False or d.get("model_training_permitted") is not False:
              raise SystemExit("Invalid load/permission gate in PUDL artifact")
          print("Verified tagged PUDL origin hashes and 24-slot source counts; NOT load-authorized")
          PY
      - name: Retrieve fixed BA annual county memberships
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-real-2020-25-EIA861-fourBA-annual-county-crosswalk-UNAPPROVED
          run-id: 43647297586
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/BA
      - name: Compare exact county FIPS across 24 BA/year slots without claiming official load geography
        run: |
          python -u -m src.c2_eia861_utility_BA_source_comparison \
            --utility-source inputs/utility/EIA861_2020_25_fourBA_utility_state_counts_SOURCE_ONLY.csv \
            --BA-memberships inputs/BA/2020_2025_EIA861_fourBA_yearly_county_FIPS_memberships_UNAPPROVED.csv \
            --out outputs/BA_utility_county_comparison
      - name: Publish descriptive 24-BA-year source-audit summary
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("outputs/BA_utility_county_comparison/E1_UTILITY_VS_BA_COUNTY_RECONCILIATION_QA.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("source_year_BA_slots_verified")!=24 or d.get("E2_training_permitted") is not False:
              raise SystemExit("Failed E1 audit publication integrity check")
          lines=[
              "## E1 county-source reconciliation (not load geography)",
              "",
              f"BA-year slots: {d['source_year_BA_slots_verified']}",
              f"Exact source-set matches: {d['exact_county_set_matches']}",
              f"BA-years with incomplete utility territory joins: {d['BA_year_slots_with_incomplete_utility_join']}",
              "",
              "| BA | Source links | Matched | Unmatched | Matching fraction |",
              "|---|---:|---:|---:|---:|",
          ]
          for ba, q in sorted(d["descriptive_source_coverage_by_BA"].items()):
              lines.append(f"| {ba} | {q['association_rows']} | {q['matched_association_rows']} | {q['unmatched_association_rows']} | {q['association_match_fraction']:.3f} |")
          lines += ["", "**Not an observed customer, load, or BA operating-area measure. E2 training remains blocked.**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c2-e1-24-BA-year-utility-versus-versioned-BA-county-difference-NOT-MODEL
          path: outputs/BA_utility_county_comparison/
          if-no-files-found: error
