name: C2 E0 historical annual source coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_yearly_coverage.py'
      - 'src/c2_temporal_gate.py'
      - 'tests/test_yearly_coverage.py'
      - '.github/workflows/e0-yearly-coverage.yml'
jobs:
  year-coverage-pilot:
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository scientific test dependencies
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5'
      - run: python -m unittest discover -s tests -v
      - name: Audit original EIA-930 four BA yearly reporting coverage
        run: python -u -m src.c2_yearly_coverage --years ${{ matrix.year }} --out outputs/e0_years
      - name: Evaluate locked time split gate
        if: always()
        run: |
          if [ -f outputs/e0_years/annual_ba_coverage.csv ]; then
            python -m src.c2_temporal_gate --coverage outputs/e0_years/annual_ba_coverage.csv --out outputs/e0_years/temporal_split_gate.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e0-${{ matrix.year }}-official-coverage
          path: outputs/e0_years/
          if-no-files-found: warn
  combined-temporal-gate:
    needs: year-coverage-pilot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: c2-e0-*-official-coverage
          path: outputs/yearly_artifacts
      - name: Combine annual BA quality results and verify six-year contract
        run: |
          python - <<'PY'
          import csv,glob,pathlib
          paths=glob.glob("outputs/yearly_artifacts/*/annual_ba_coverage.csv")
          if len(paths)!=6:raise RuntimeError(f"Expected six annual artifacts, got {len(paths)}")
          rows=[]
          for path in paths:
              with open(path,newline="") as f:rows.extend(csv.DictReader(f))
          keys=[(int(r["year"]),r["ba"]) for r in rows]
          if len(rows)!=24 or len(set(keys))!=24:raise RuntimeError("Unexpected annual BA key coverage")
          out=pathlib.Path("outputs/e0_combined")
          out.mkdir(parents=True,exist_ok=True)
          with (out/"annual_ba_coverage_2020_2025.csv").open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader()
              w.writerows(sorted(rows,key=lambda x:(int(x["year"]),x["ba"])))
          PY
      - name: Evaluate combined chronological admission
        run: python -m src.c2_temporal_gate --coverage outputs/e0_combined/annual_ba_coverage_2020_2025.csv --out outputs/e0_combined/temporal_split_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e0-2020-2025-combined-admission
          path: outputs/e0_combined/
          if-no-files-found: warn
