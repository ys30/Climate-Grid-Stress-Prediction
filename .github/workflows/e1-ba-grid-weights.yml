name: C2 E1 geometry grid-weight unit contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_ba_era5_weights.py'
      - 'tests/test_ba_era5_weights.py'
      - '.github/workflows/e1-ba-grid-weights.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry libraries
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5'
      - name: Run all tests including synthetic shape algorithm fixture
        run: python -m unittest discover -s tests -v
