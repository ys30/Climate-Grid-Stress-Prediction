name: C2 phase-1 contracts
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/phase1-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/phase1-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2-phase1-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install E1 test dependencies
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'openpyxl>=3.1' 'scipy>=1.12' 'requests>=2.32' 'beautifulsoup4>=4.12'
      - run: python -m unittest discover -s tests -v
