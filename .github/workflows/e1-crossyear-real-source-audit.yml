name: C2 E1 real 2020-2025 cross-year 48h source audit NOT MODEL
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e1-crossyear-real-source-audit.yml'
      - 'src/c2_era5_seasonal_source_audit.py'
jobs:
  year-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - name: Unit and model-admission contracts
        run: python -m unittest discover -s tests -v
      - name: Download frozen PROVISIONAL polygon-area weights
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/weights
      - name: Download original EIA930 previous-year H2 and current-year halves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/eia
          prior=$((${{ matrix.year }} - 1))
          for half in "${prior}_Jul_Dec" "${{ matrix.year }}_Jan_Jun" "${{ matrix.year }}_Jul_Dec"; do
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 150 \
              -o "inputs/eia/${half}.csv" \
              "https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_${half}.csv"
          done
      - name: Verify real two-day July ERA5 grid and exact EIA BA-hour alignment
        run: |
          python -u -m src.c2_era5_seasonal_source_audit \
            --start '${{ matrix.year }}-07-01T00:00:00Z' --days 2 \
            --weights inputs/weights/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --eia-files inputs/eia/*.csv \
            --out outputs/e1_crossyear
      - name: Preserve complete observed paired CSV and source hashes by year
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-crossyear-real-july-48h-${{ matrix.year }}-NOT-MODEL
          path: outputs/e1_crossyear/
          if-no-files-found: warn
