name: C2 E2 Real Public ARCO ERA5 February 2024 Source Pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c2-era5-public-february-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-real-era5-month:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public ARCO ERA5 Zarr dependencies
        run: python -m pip install 'xarray>=2024.5' 'zarr>=3,<4' 'gcsfs>=2025.3' 'numpy>=1.26'
      - name: Test leap-February timeline, missing hours and source limitation
        run: python -m unittest discover -s tests -p 'test_c2_era5_public_monthly_probe.py' -v
      - name: Retrieve actual 696 UTC-hours of February 2024 from public ARCO ERA5
        run: |
          python -u -m src.c2_era5_public_monthly_probe \
            --output evidence/era5_public/arco_2024_02_sacramento_single_gridcell.csv
      - name: Verify observed calendar-hour count, UTC, SHA and no BA exposure
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path('evidence/era5_public/arco_2024_02_sacramento_single_gridcell.csv')
          m=json.loads(p.with_suffix('.manifest.json').read_text())
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          assert m['source_kind']=='public_ARCO_ERA5_Zarr_single_gridcell_month'
          assert m['n_unique_hours']==696 and len(rows)==696
          assert m['sha256_csv']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert rows[0]['timestamp_utc']=='2024-02-01T00:00:00Z'
          assert rows[-1]['timestamp_utc']=='2024-02-29T23:00:00Z'
          assert m['is_CISO_BA_weather_exposure'] is False
          assert m['eia_join_executed'] is False
          print('Authentic ARCO ERA5 source: 696 complete UTC hours; no BA exposure claim')
          PY
      - name: Preserve real weather evidence regardless of failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-real-arco-era5-february-2024-${{ github.run_id }}
          path: evidence/era5_public/
          if-no-files-found: warn
          retention-days: 30
