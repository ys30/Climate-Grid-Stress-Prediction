name: C2 BPAT actual FERC714 respondent21 core-hour export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/c2_bpat_ferc714_21_real_core_hour_export.py
      - tests/test_c2_bpat_ferc714_21_real_core_hour_export.py
      - .github/workflows/c2-bpat-ferc714-21-real-core-hour-export.yml
permissions:
  contents: read
jobs:
  export-respondent21-core-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DuckDB with pinned version
        run: python -m pip install 'duckdb==1.4.1'
      - name: Run strict synthetic source admission tests
        run: python -m unittest discover -s tests -p 'test_c2_bpat_ferc714_21_real_core_hour_export.py' -v
      - name: Try pinned version PUDL core Parquet via S3
        id: s3_export
        continue-on-error: true
        run: python -m scripts.c2_bpat_ferc714_21_real_core_hour_export --out outputs/c2_bpat_ferc714_21_core_s3 --transport s3
      - name: Fallback same PUDL core Parquet via HTTPS Range
        if: steps.s3_export.outcome == 'failure'
        continue-on-error: true
        run: python -m scripts.c2_bpat_ferc714_21_real_core_hour_export --out outputs/c2_bpat_ferc714_21_core_https --transport https
      - name: Require actual nonempty hourly rows with matching source-derived SHA
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys
          valid=[]
          for transport in ('s3','https'):
              root=pathlib.Path('outputs/c2_bpat_ferc714_21_core_'+transport)
              p=root/'PUDL_FERC714_BPA_RESPONDENT21_2020_2025_CORE_HOURLY.csv'
              m=root/'PUDL_FERC714_BPA21_CORE_HOURLY_SOURCE_PROVENANCE.json'
              if not p.is_file() or not m.is_file():
                  continue
              meta=json.loads(m.read_text())
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if (meta.get('status')=='CORE_SOURCE_HOURLY_EXTRACTED_UNAPPROVED'
                  and meta.get('rows',0)>0
                  and meta.get('source_table')=='core_ferc714__hourly_planning_area_demand'
                  and meta.get('derived_core_hourly_csv_sha256')==actual):
                  valid.append((transport,meta['rows'],actual))
          print('Actual verified derived source row files:',valid)
          if not valid:
              sys.exit('No authentic respondent-21 hourly source row CSV obtained from either transport')
          PY
      - name: Upload true derived respondent 21 rows and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C2-BPAT-FERC714-21-CORE-REAL-HOURS-SOURCE-UNAPPROVED
          path: |
            outputs/c2_bpat_ferc714_21_core_s3/
            outputs/c2_bpat_ferc714_21_core_https/
          if-no-files-found: warn
          retention-days: 30
