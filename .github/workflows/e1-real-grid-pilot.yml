name: C2 E1 actual ERA5 sampled weighted cells only
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_era5_real_grid_pilot.py'
      - 'tests/test_era5_real_grid_pilot.py'
      - '.github/workflows/e1-real-grid-pilot.yml'
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - run: python -m unittest discover -s tests -v
      - name: Download frozen experimental four-BA weights from successful source-based CI
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/e1_frozen
      - name: Read real hourly ARCO ERA5 samples at selected source-derived cells
        run: |
          python -u -m src.c2_era5_real_grid_pilot \
            --weights inputs/e1_frozen/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --time 2023-07-01T12:00:00Z \
            --out outputs/e1_real_grid_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-ERA5-12-grid-cell-access-pilot
          path: outputs/e1_real_grid_pilot
          if-no-files-found: warn
