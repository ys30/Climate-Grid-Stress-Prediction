name: C2 E1 area-weighted ERA5 aggregation contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_era5_area_aggregate.py'
      - 'tests/test_era5_area_aggregate.py'
      - '.github/workflows/e1-era5-area-aggregation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5'
      - run: python -m unittest discover -s tests -v
