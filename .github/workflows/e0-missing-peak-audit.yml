name: C2 E0 exact missing hours and raw peak diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_missing_peak_audit.py'
      - 'tests/test_missing_peak_audit.py'
      - '.github/workflows/e0-missing-peak-audit.yml'
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Download original EIA-930 source slices
        run: |
          mkdir -p inputs
          for half in Jan_Jun Jul_Dec; do
            curl --fail --location --silent --show-error --max-time 120 \
              --output "inputs/${{ matrix.year }}_${half}.csv" \
              "https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_${{ matrix.year }}_${half}.csv"
          done
      - name: Review exact raw missing keys and top demand observations
        run: |
          python -m src.c2_missing_peak_audit --year ${{ matrix.year }} \
            --csv inputs/${{ matrix.year }}_Jan_Jun.csv inputs/${{ matrix.year }}_Jul_Dec.csv \
            --out outputs/e0_diagnostics
      - name: Print top raw spikes and earliest missing-hour samples
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path('outputs/e0_diagnostics')
          with (root/'raw_peak_candidates.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          for ba in ['AZPS','BPAT','CISO','SRP']:
              a=[r for r in rows if r['ba']==ba]
              print('MAX_RAW_OBSERVATION',a[0] if a else None)
              for r in a:
                  if r['candidate_spike']=='True':
                      print('CANDIDATE_SPIKE',r)
          with (root/'exact_missing_hour_keys.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          print('MISSING_FIRST_TWELVE',rows[:12])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e0-exact-qa-${{ matrix.year }}
          path: outputs/e0_diagnostics
          if-no-files-found: warn
