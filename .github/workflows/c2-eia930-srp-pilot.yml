name: C2 EIA-930 SRP July 2025 live pilot

on:
  push:
    paths:
      - '.github/workflows/c2-eia930-srp-pilot.yml'
      - 'scripts/c2_fetch_eia930_df.py'
      - 'scripts/c2_eia930_day_ahead_benchmark.py'
      - 'scripts/c2_verify_eia930_source.py'
      - 'scripts/c2_fetch_eia930_bulk.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  srp-eia-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Check out pinned repo version
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline EIA collector and hourly alignment tests first
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_c2_fetch_eia930_df.py' -v
          python -m unittest discover -s tests -p 'test_c2_eia930_day_ahead_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_c2_fetch_eia930_bulk.py' -v
      - name: Detect optional EIA API key
        id: preflight
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "EIA_API_KEY unavailable; using official public EIA BALANCE CSV fallback"
          else
            echo "available=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch via EIA API if configured
        id: fetch
        if: steps.preflight.outputs.available == 'yes'
        continue-on-error: true
        run: |
          python scripts/c2_fetch_eia930_df.py pilot/source \
            --start-year 2025 --end-year 2025 --month 7 --ba SRP
      - name: Fallback to public official EIA BALANCE archive
        id: bulk
        if: steps.fetch.outcome != 'success'
        run: |
          python scripts/c2_fetch_eia930_bulk.py pilot/source \
            --year 2025 --month 7 --ba SRP
      - name: Verify original EIA source rows and manifest
        id: integrity
        run: |
          python scripts/c2_verify_eia930_source.py \
            pilot/source/eia930_D_DF_hourly.csv \
            pilot/source/source_manifest.json \
            --output pilot/source/source_integrity.json
      - name: Score full 24-hour UTC days
        id: score
        run: |
          python scripts/c2_eia930_day_ahead_benchmark.py \
            pilot/source/eia930_D_DF_hourly.csv pilot/daily --ba SRP
      - name: Pilot gate for complete UTC July
        id: coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          src=json.loads(Path('pilot/source/source_manifest.json').read_text())
          scored=list(csv.DictReader(open('pilot/daily/eia930_df_daily.csv', newline='')))
          incomplete=list(csv.DictReader(open('pilot/daily/excluded_days.csv', newline='')))
          july={r['date_utc'] for r in scored if r['ba']=='SRP' and r['date_utc'].startswith('2025-07-')}
          print(json.dumps({'source_rows':src['row_count'],'complete_july_days':len(july),
                            'incomplete_days':len(incomplete),'sample_coverage':len(july)/31}, indent=2))
          if len(july)<25:
              raise SystemExit('Insufficient complete SRP days for pilot (<25/31); investigate source and hour semantics')
          PY
      - name: Save step outcomes for failure diagnosis
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.preflight.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BULK_OUTCOME: ${{ steps.bulk.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p pilot/diagnostics
          python - <<'PY'
          import json,os
          from pathlib import Path
          result={name:os.environ[name+'_OUTCOME'] for name in
                  ('KEY','FETCH','BULK','INTEGRITY','SCORE','COVERAGE')}
          Path('pilot/diagnostics/step_outcomes.json').write_text(json.dumps(result,indent=2)+'\\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## C2 SRP official EIA-930 source pilot\\n\\n')
              for key,value in result.items():
                  f.write(f'- {key.lower()}: **{value}**\\n')
              f.write('\\nThis summary does not contain the API key. For any failed step, inspect its raw GitHub Actions log.\\n')
          PY
      - name: Always upload source and error artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-srp-eia930-july-2025-pilot
          path: pilot/
          retention-days: 30
          if-no-files-found: warn
