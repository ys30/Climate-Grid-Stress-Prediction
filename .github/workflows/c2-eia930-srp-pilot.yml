name: C2 EIA-930 SRP July 2025 live pilot

on:
  push:
    paths:
      - '.github/workflows/c2-eia930-srp-pilot.yml'
      - 'scripts/c2_fetch_eia930_df.py'
      - 'scripts/c2_eia930_day_ahead_benchmark.py'
      - 'scripts/c2_verify_eia930_source.py'
      - 'scripts/c2_fetch_eia930_bulk.py'
      - 'tests/test_c2_eia930_bulk_download.py'
      - 'tests/test_c2_eia930_full_month_pipeline.py'
      - 'scripts/c2_eia930_pilot_quality_gate.py'
  workflow_dispatch:

concurrency:
  group: c2-eia930-srp-pilot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  srp-eia-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Check out pinned repo version
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline EIA collector and hourly alignment tests first
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_c2_fetch_eia930_df.py' -v
          python -m unittest discover -s tests -p 'test_c2_eia930_day_ahead_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_c2_fetch_eia930_bulk.py' -v
          python -m unittest discover -s tests -p 'test_c2_eia930_bulk_download.py' -v
          python -m unittest discover -s tests -p 'test_c2_eia930_full_month_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_c2_eia930_pilot_quality_gate.py' -v
      - name: Detect optional EIA API key
        id: preflight
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "EIA_API_KEY unavailable; using official public EIA BALANCE CSV fallback"
          else
            echo "available=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect and verify EIA API source when configured
        id: fetch
        if: steps.preflight.outputs.available == 'yes'
        continue-on-error: true
        run: |
          timeout 180s python scripts/c2_fetch_eia930_df.py pilot/source \
            --start-year 2025 --end-year 2025 --month 7 --ba SRP
          python scripts/c2_verify_eia930_source.py \
            pilot/source/eia930_D_DF_hourly.csv \
            pilot/source/source_manifest.json \
            --output pilot/source/source_integrity.json
          python scripts/c2_eia930_day_ahead_benchmark.py \
            pilot/source/eia930_D_DF_hourly.csv pilot/api_daily --ba SRP
          python scripts/c2_eia930_pilot_quality_gate.py \
            pilot/api_daily/eia930_df_daily.csv \
            pilot/api_daily/excluded_days.csv \
            pilot/source/source_manifest.json --ba SRP --year 2025 --month 7 \
            --min-days 25 --output pilot/api_daily/quality_gate.json
      - name: Preserve failed API source and try public EIA BALANCE
        id: bulk
        if: steps.fetch.outcome != 'success'
        run: |
          if [ -d pilot/source ]; then
            mv pilot/source pilot/failed_api_source
          fi
          if [ -d pilot/api_daily ]; then
            mv pilot/api_daily pilot/failed_api_daily
          fi
          python scripts/c2_fetch_eia930_bulk.py pilot/source \
            --year 2025 --month 7 --ba SRP
      - name: Verify selected source (API or official bulk) before scoring
        id: integrity
        run: |
          python scripts/c2_verify_eia930_source.py \
            pilot/source/eia930_D_DF_hourly.csv \
            pilot/source/source_manifest.json \
            --output pilot/source/source_integrity.json
      - name: Score full 24-hour UTC days
        id: score
        run: |
          python scripts/c2_eia930_day_ahead_benchmark.py \
            pilot/source/eia930_D_DF_hourly.csv pilot/daily --ba SRP
      - name: Pilot gate for complete UTC July
        id: coverage
        run: |
          python scripts/c2_eia930_pilot_quality_gate.py \
            pilot/daily/eia930_df_daily.csv \
            pilot/daily/excluded_days.csv \
            pilot/source/source_manifest.json --ba SRP --year 2025 --month 7 \
            --min-days 25 --output pilot/daily/quality_gate.json
      - name: Report coverage admission separately from forecast validation
        if: steps.coverage.outcome == 'success'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('pilot/daily/quality_gate.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"## SRP 2025-07 data coverage: {r['admission']}\n\n")
              f.write(f"Complete days: **{r['complete_days']}/{r['calendar_days']}**. ")
              f.write("Passing this gate does not validate original forecast issue-time or model skill.\n\n")
          PY
      - name: Save step outcomes for failure diagnosis
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.preflight.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BULK_OUTCOME: ${{ steps.bulk.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p pilot/diagnostics
          python - <<'PY'
          import json,os
          from pathlib import Path
          result={name:os.environ[name+'_OUTCOME'] for name in
                  ('KEY','FETCH','BULK','INTEGRITY','SCORE','COVERAGE')}
          Path('pilot/diagnostics/step_outcomes.json').write_text(json.dumps(result,indent=2)+'\n')
          json.loads(Path('pilot/diagnostics/step_outcomes.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## C2 SRP official EIA-930 source pilot\n\n')
              for key,value in result.items():
                  f.write(f'- {key.lower()}: **{value}**\n')
              f.write('\nThis summary does not contain the API key. For any failed step, inspect its raw GitHub Actions log.\n')
          PY
      - name: Always upload source and error artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-srp-eia930-july-2025-pilot
          path: pilot/
          retention-days: 30
          if-no-files-found: warn
