name: C2 E1 real 24-hour full-grid experimental BA exposures
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_era5_24h_exploratory.py'
      - 'tests/test_era5_24h_exploratory.py'
      - '.github/workflows/e1-real-24h-exposures.yml'
jobs:
  real-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - run: python -m unittest discover -s tests -v
      - name: Download frozen all-BA experimental area weights
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/e1_frozen
      - name: Fetch one real day from full bounded public ARCO grid and aggregate 96 BA hours
        run: |
          python -u -m src.c2_era5_24h_exploratory \
            --weights inputs/e1_frozen/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --start 2023-07-01T00:00:00Z \
            --out outputs/e1_real_24h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-era5-24h-4BA-provisional
          path: outputs/e1_real_24h/
          if-no-files-found: warn
