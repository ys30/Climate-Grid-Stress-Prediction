name: C2 E1 historical PUDL EIA861 annual four BA county crosswalk
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_pudl_ba_yearly_crosswalk.py'
      - 'tests/test_pudl_ba_yearly_crosswalk.py'
      - '.github/workflows/e1-pudl-four-ba-yearly-crosswalk.yml'
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2' 'pyarrow>=18' 's3fs>=2025.3'
      - run: python -m unittest discover -s tests -p 'test_pudl_ba_yearly_crosswalk.py' -v
      - name: Read actual PUDL EIA861 yearly BA identities and annual counties, assess 4 BA crosswalk
        run: |
          python -u -m src.c2_pudl_ba_yearly_crosswalk \
            --out outputs/e1_pudl_fourBA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-2020-25-EIA861-fourBA-annual-county-crosswalk-UNAPPROVED
          path: outputs/e1_pudl_fourBA/
          if-no-files-found: warn
