name: C2 episode tail audit tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2-tail-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime diagnostics
        run: |
          pwd
          python --version
          python -c "import os,sys; print('cwd=',os.getcwd()); print('sys.path=',sys.path)"
          test -f scripts/c2_episode_tail_audit.py
          test -f scripts/c2_cross_model_integrity.py
          test -f tests/test_c2_episode_tail_audit.py
          test -f tests/test_c2_cross_model_integrity.py
          test -f scripts/c2_run_validated_audit.py
          test -f tests/test_c2_run_validated_audit.py
          test -f scripts/c2_archive_inventory.py
          test -f tests/test_c2_archive_inventory.py
          test -f scripts/c2_eia930_day_ahead_benchmark.py
          test -f tests/test_c2_eia930_day_ahead_benchmark.py
      - name: Python syntax validation
        run: python -m compileall -q scripts/c2_episode_tail_audit.py scripts/c2_cross_model_integrity.py tests/test_c2_episode_tail_audit.py tests/test_c2_cross_model_integrity.py scripts/c2_run_validated_audit.py tests/test_c2_run_validated_audit.py scripts/c2_archive_inventory.py tests/test_c2_archive_inventory.py scripts/c2_eia930_day_ahead_benchmark.py tests/test_c2_eia930_day_ahead_benchmark.py
      - name: Episode audit regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_c2_episode_tail_audit.py' -v
      - name: Validated audit end-to-end tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_c2_run_validated_audit.py' -v
      - name: Archive inventory unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_c2_archive_inventory.py' -v
      - name: EIA-930 historical DF benchmark unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_c2_eia930_day_ahead_benchmark.py' -v
      - name: Cross-estimator integrity regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_c2_cross_model_integrity.py' -v
