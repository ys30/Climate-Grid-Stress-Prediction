name: C2 episode tail audit tests

on:
  push:
    paths:
      - 'scripts/c2_episode_tail_audit.py'
      - 'scripts/c2_cross_model_integrity.py'
      - 'tests/test_c2_episode_tail_audit.py'
      - 'tests/test_c2_cross_model_integrity.py'
      - '.github/workflows/c2-episode-tail-audit.yml'
  pull_request:
    paths:
      - 'scripts/c2_episode_tail_audit.py'
      - 'scripts/c2_cross_model_integrity.py'
      - 'tests/test_c2_episode_tail_audit.py'
      - 'tests/test_c2_cross_model_integrity.py'
      - '.github/workflows/c2-episode-tail-audit.yml'
  workflow_dispatch:

jobs:
  c2-tail-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run C2 episode tests and cross-model integrity tests
        run: python -m unittest discover -s tests -p 'test_c2_*.py' -v
