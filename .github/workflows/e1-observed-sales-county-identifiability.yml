name: C2 E1 observed retail MWh county allocation identifiability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/c2_e1_real_sales_county_identifiability.py"
      - "tests/test_c2_e1_real_sales_county_identifiability.py"
      - ".github/workflows/e1-observed-sales-county-identifiability.yml"
permissions:
  actions: read
  contents: read
jobs:
  actual-MWh-geographic-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SALES_URI: s3://pudl.catalyst.coop/v2026.10.0/core_eia861__yearly_sales.parquet
      SALES_PATH: inputs/pudl_v2026_10_original_sales.parquet
      OUT: outputs/c2_e1_sales_county_identifiability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source MWh identifiability regression tests
        run: python -m unittest discover -s tests -p 'test_c2_e1_real_sales_county_identifiability.py' -v
      - name: Install pinned-source read dependencies
        run: python -m pip install --disable-pip-version-check pyarrow awscli
      - name: Download original county-FIPS source artifact and pinned annual Sales Parquet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs "$OUT"
          gh api -H 'Accept: application/vnd.github+json' \
             "repos/${GITHUB_REPOSITORY}/actions/artifacts/14393473675/zip" > inputs/verified_933_utility_county_fips.zip
          aws s3 cp --no-progress --no-sign-request --region us-west-2 \
             "$SALES_URI" "$SALES_PATH"
          printf '%s  %s\n' \
             "996d6ac640ab664272187711a45b5944cf3116cab882ca05749f93d4a74ae9fe" \
             "$SALES_PATH" | sha256sum -c -
      - name: Quantify observed annual MWh with zero one or multiple reported utility counties
        run: |
          python -m src.c2_e1_real_sales_county_identifiability \
            --sales "$SALES_PATH" \
            --original-fips-artifact inputs/verified_933_utility_county_fips.zip \
            --out "$OUT"
      - name: Enforce original independent 2020-2023 BA-year sales control totals
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/14310951946/zip" \
            > inputs/previous_verified_actual_sales_coverage.zip
          python - <<'PY'
          import csv,io,math,os,zipfile
          from collections import defaultdict
          with zipfile.ZipFile("inputs/previous_verified_actual_sales_coverage.zip") as z:
              source=list(csv.DictReader(io.StringIO(z.read("C2_E1_EIA861_BA_YEAR_SALES_COVERAGE.csv").decode("utf-8-sig"))))
          expected=defaultdict(float)
          for r in source:
              if int(r["year"])<=2023 and r["selected_observed_bundled_sales_mwh"]:
                  expected[int(r["year"]),r["BA"]]+=float(r["selected_observed_bundled_sales_mwh"])
          with open(os.environ["OUT"]+"/C2_16_BAYEAR_OBSERVED_MWH_COUNTY_IDENTIFIABILITY.csv") as f:
              actual=list(csv.DictReader(f))
          assert len(actual)==len(expected)==16
          for r in actual:
              key=int(r["year"]),r["BA"]
              got=float(r["selected_observed_bundled_MWh"])
              if not math.isclose(got,expected[key],rel_tol=1e-11,abs_tol=0.001):
                  raise SystemExit(f"FAIL CLOSED sales source mismatch: {key}: {got} vs {expected[key]}")
          print("ALL 16 independent actual BA-year original retail MWh totals RECONCILED")
          PY
      - name: Preserve any fail-closed diagnostic
        if: failure()
        run: |
          mkdir -p "$OUT"
          echo "Failed: no geographic load allocation admitted" > "$OUT/FAILURE_DIAGNOSTIC.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-observed-2020-23-MWh-county-cardinality-NOT-MODEL
          path: outputs/c2_e1_sales_county_identifiability/
          if-no-files-found: warn
