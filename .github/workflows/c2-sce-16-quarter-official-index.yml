name: C2 SCE 2020-2023 Authentic Quarterly Publisher XLSX Index Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c2-sce-16-quarter-official-index.yml'
      - 'scripts/c2_sce_real_2020_2023_original_quarter_index_audit.py'
      - 'tests/test_c2_sce_real_2020_2023_original_quarter_index_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2-sce-16-quarter-official-index
  cancel-in-progress: true
jobs:
  official-original-xlsx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only publisher webpage and XLSX readers
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3 openpyxl==3.1.5
      - name: Confirm official quarter-link discovery fail-closed unit tests
        run: python -m unittest discover -s tests -p 'test_c2_sce_real_2020_2023_original_quarter_index_audit.py' -v
      - name: Inspect original 16 publisher spreadsheets with immutable source digests
        run: |
          mkdir -p evidence/audit
          python -m scripts.c2_sce_real_2020_2023_original_quarter_index_audit \
            --output evidence/audit/C2_SCE_2020_2023_REAL_16_QUARTER_ORIGINAL_XLSX_SHA.json
      - name: Block load geography or model skill claim on missing privacy support
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/audit/C2_SCE_2020_2023_REAL_16_QUARTER_ORIGINAL_XLSX_SHA.json'))
          assert d['quarter_count_verified']==16
          assert d['all_2020_2023_original_sources_verified']
          assert d['ZIP_to_county_allocation_performed'] is False
          assert d['CISO_BA_membership_verified'] is False
          assert d['model_training_permitted'] is False
          print('Official historical SCE quarterly original evidence verified, spatial inference blocked')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-sce-16-quarter-real-publisher-source-${{ github.run_id }}
          path: evidence/audit/
          if-no-files-found: warn
          retention-days: 30
