name: C2 E2 Joint Coverage Gate Tests

on:
  push:
    paths:
      - "scripts/c2_e2_joint_coverage_gate.py"
      - "tests/test_c2_e2_joint_coverage_gate.py"
      - ".github/workflows/c2-e2-coverage-gate.yml"
  pull_request:
    paths:
      - "scripts/c2_e2_joint_coverage_gate.py"
      - "tests/test_c2_e2_joint_coverage_gate.py"
      - ".github/workflows/c2-e2-coverage-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test sourced BA-hour coverage fail-closed guardrails
        run: python -m unittest discover -s tests -p 'test_c2_e2_joint_coverage_gate.py' -v
