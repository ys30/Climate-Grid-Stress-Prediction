name: C2 E1 real monthly ERA5 EIA930 source pairing NOT MODEL
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e1-real-monthly-source-audit.yml'
jobs:
  month:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2020, 2025]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=1.26' 'xarray>=2024.5' 'shapely>=2.0' 'pyproj>=3.5' 'zarr>=3,<4' 'gcsfs>=2025.3'
      - name: Check contract tests before accessing remote weather
        run: python -m unittest discover -s tests -v
      - name: Download SHA-pinned exploratory BA polygon-area weights
        uses: actions/download-artifact@v4
        with:
          name: c2-e1-unapproved-4ba-area-grid-overlap
          run-id: 43548907152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/weights
      - name: Acquire 3 official source semesters incl previous-year lookback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/eia
          prior=$((${{ matrix.year }} - 1))
          for half in "${prior}_Jul_Dec" "${{ matrix.year }}_Jan_Jun" "${{ matrix.year }}_Jul_Dec"; do
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 150 \
              -o "inputs/eia/${half}.csv" \
              "https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_${half}.csv"
          done
      - name: Retrieve all 31 days of actual hourly ARCO 2m T and EIA-930 demand, quarantine gaps
        run: |
          python -u -m src.c2_era5_seasonal_source_audit \
            --start '${{ matrix.year }}-07-01T00:00:00Z' --days 31 \
            --allow-source-gaps \
            --weights inputs/weights/e1_exploratory/exploratory_BA_grid_weights_UNAPPROVED.csv \
            --eia-files inputs/eia/*.csv \
            --out outputs/e1_monthly
      - name: Confirm exact month count and model permission blocked
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("outputs/e1_monthly/seasonal_source_audit.json").read_text())
          assert p["days"]==31 and p["source_BA_hour_slots"]==2976
          assert p["weather_source_rows"]==2976 and p["all_weather_hours_present"]
          assert p["paired_source_rows"]+p["source_missing_demand_hours"]==2976
          assert p["training_or_validation_permitted"] is False
          assert p["historical_geometry_approved"] is False
          assert p["no_imputation"] is True
          print("E1_MONTH_QA_PASS",p["utc_start"],p["paired_source_rows"],p["source_missing_demand_hours"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-real-july-${{ matrix.year }}-full-month-PROVISIONAL-NOT-MODEL
          path: outputs/e1_monthly/
          if-no-files-found: warn
