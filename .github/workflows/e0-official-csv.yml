name: C2 E0 official EIA930 CSV source
on:
  push:
    paths:
      - 'src/c2_official_csv_probe.py'
      - 'tests/test_official_csv_probe.py'
      - '.github/workflows/e0-official-csv.yml'
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Audit 2024 July 1 actual reported four-BA raw demand
        run: python -m src.c2_official_csv_probe --half 2024_Jul_Dec --start 2024-07-01T00:00:00+00:00 --end 2024-07-01T23:00:00+00:00 --out outputs/e0_official
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e0-official-source-quality-audit
          path: outputs/e0_official/
          if-no-files-found: warn
