name: C2 E2 Real Public ARCO ERA5 24-Hour Source Pilot

# Public Google ARCO ERA5, independent of Copernicus CDS credentials.
on:
  push:
    branches: [main]
    paths:
      - 'src/c2_era5_public_daily_probe.py'
      - 'tests/test_c2_era5_public_daily_probe.py'
      - '.github/workflows/c2-era5-public-daily-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-real-era5-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public ARCO ERA5 Zarr adapter dependencies
        run: python -m pip install 'xarray>=2024.5' 'zarr>=3,<4' 'gcsfs>=2025.3' 'numpy>=1.26'
      - name: Check fail-closed UTC/Kelvin and incomplete-hour contracts
        run: python -m unittest discover -s tests -p 'test_c2_era5_public_daily_probe.py' -v
      - name: Read one complete real ERA5 gridpoint day from public ARCO Zarr
        run: |
          python -u -m src.c2_era5_public_daily_probe \
            --date 2024-02-01 --lat 38.5 --lon -121.5 \
            --output evidence/era5_public/arco_2024_02_01_sacramento_single_gridcell.csv
      - name: Confirm genuine source output is a single-grid source pilot only
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path('evidence/era5_public/arco_2024_02_01_sacramento_single_gridcell.csv')
          m=json.loads(p.with_suffix('.manifest.json').read_text())
          with p.open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert m['source_kind']=='public_ARCO_ERA5_Zarr_one_gridcell'
          assert len(rows)==24
          assert m['n_unique_hours']==24
          assert m['sha256_csv']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert m['ba_exposure_qualified'] is False and m['joined_to_eia'] is False
          print('24 observed source hours, immutable output SHA, no BA exposure claim')
          PY
      - name: Preserve observable source sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-real-public-arco-era5-24h-${{ github.run_id }}
          path: evidence/era5_public/
          if-no-files-found: warn
          retention-days: 30
