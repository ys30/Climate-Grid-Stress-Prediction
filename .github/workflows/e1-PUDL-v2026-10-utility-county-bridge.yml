name: C2 E1 PUDL v2026.10 BA utility state county source bridge audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/c2_eia861_ba_utility_county_probe.py'
      - 'tests/test_c2_eia861_ba_utility_county_probe.py'
      - '.github/workflows/e1-PUDL-v2026-10-utility-county-bridge.yml'
jobs:
  inspect-real-utility-geography-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2' 'pyarrow>=15' 's3fs>=2025'
      - run: python -m unittest discover -s tests -p 'test_c2_eia861_ba_utility_county_probe.py' -v
      - name: Inspect source-derived BA utility and county coverage, preserve ambiguous crosswalks
        run: python -u -m src.c2_eia861_ba_utility_county_probe --out outputs/eia861_utility_geo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-e1-PUDL-fixed-v2026-10-real-BA-utility-county-bridge-NOT-LOAD
          path: outputs/eia861_utility_geo/
          if-no-files-found: warn
